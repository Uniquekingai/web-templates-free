<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const W = canvas.width, H = canvas.height;
const CX = W / 2, CY = H / 2;

// ── 7 rainbow colors ──────────────────────────────────────────────────────────
const COLORS = [
  { r:255, g:40,  b:80  },  // red
  { r:255, g:140, b:0   },  // orange
  { r:255, g:230, b:0   },  // yellow
  { r:40,  g:220, b:60  },  // green
  { r:0,   g:180, b:255 },  // cyan/blue
  { r:80,  g:60,  b:255 },  // indigo
  { r:200, g:0,   b:255 },  // violet
];

function lerpColor(a, b, t) {
  return {
    r: a.r + (b.r - a.r) * t,
    g: a.g + (b.g - a.g) * t,
    b: a.b + (b.b - a.b) * t,
  };
}

// Smooth cycle through 7 colors given time 0..∞
function cycleColor(t) {
  const total = COLORS.length;
  const idx = t % total;
  const i = Math.floor(idx);
  const frac = idx - i;
  return lerpColor(COLORS[i % total], COLORS[(i + 1) % total], frac);
}

function cssRgb(c, a = 1) {
  return `rgba(${Math.round(c.r)},${Math.round(c.g)},${Math.round(c.b)},${a})`;
}

// ── Heart path ────────────────────────────────────────────────────────────────
function heartPoint(t, scale, ox, oy) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
  return { x: ox + x * scale, y: oy + y * scale };
}
const SCALE = Math.min(W, H) * 0.027;
const TOTAL = 700;
const heartPath = [];
for (let i = 0; i <= TOTAL; i++) {
  heartPath.push(heartPoint((i / TOTAL) * Math.PI * 2, SCALE, CX, CY));
}

// ── Particles ─────────────────────────────────────────────────────────────────
const PCOUNT = 420;
const particles = [];

function spawnParticle(x, y) {
  return {
    x: x !== undefined ? x : Math.random() * W,
    y: y !== undefined ? y : Math.random() * H,
    vx: (Math.random() - 0.5) * 0.5,
    vy: (Math.random() - 0.5) * 0.5 - 0.08,
    r: Math.random() * 1.6 + 0.3,
    baseAlpha: Math.random() * 0.55 + 0.15,
    absorbed: false,
    absorbT: 0,
    colorT: 0,       // how much color it has taken (0=white, 1=full hue)
    twinkle: Math.random() * Math.PI * 2,
    twinkleS: Math.random() * 0.03 + 0.006,
    dead: false,
  };
}

for (let i = 0; i < PCOUNT; i++) particles.push(spawnParticle());

// ── State ─────────────────────────────────────────────────────────────────────
let progress = 0;
const DRAW_SPEED = 0.0016;
const TRAIL = 85;
let done = false;
let frame = 0;
let colorPhase = 0;          // advances after done to cycle colors
const COLOR_CYCLE_SPEED = 0.012;
const drawnSegs = [];

const ATTRACT_R = 90;
const ATTRACT_F = 0.09;

function draw() {
  frame++;

  // Current main color (during draw: tied to progress through 7 colors; after: cycles)
  let mainColor;
  if (!done) {
    mainColor = cycleColor(progress * (COLORS.length - 1));
  } else {
    colorPhase += COLOR_CYCLE_SPEED;
    mainColor = cycleColor(colorPhase);
  }

  // Fade background
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(0, 0, W, H);

  const tipIdx = Math.min(Math.floor(progress * TOTAL), TOTAL);
  const tip = heartPath[tipIdx];

  // ── Particles ──────────────────────────────────────────────────────────────
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (p.dead) { particles.splice(i, 1); particles.push(spawnParticle()); continue; }

    const dx = tip.x - p.x, dy = tip.y - p.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const inRange = !done && dist < ATTRACT_R;

    if (inRange) {
      const force = (1 - dist / ATTRACT_R) * ATTRACT_F;
      p.vx += dx / dist * force;
      p.vy += dy / dist * force;
      p.colorT = Math.min(1, p.colorT + 0.03 * (1 - dist / ATTRACT_R));
      if (dist < 8) { p.dead = true; continue; }
    } else {
      p.vx += (Math.random() - 0.5) * 0.008;
      p.vy += (Math.random() - 0.5) * 0.008;
      p.vx *= 0.98; p.vy *= 0.98;
      // After done, all particles slowly shift color
      if (done) p.colorT = Math.min(1, p.colorT + 0.005);
    }

    p.x += p.vx; p.y += p.vy;
    if (p.x < -10) p.x = W+10;
    if (p.x > W+10) p.x = -10;
    if (p.y < -10) p.y = H+10;
    if (p.y > H+10) p.y = -10;

    const tw = Math.sin(frame * p.twinkleS + p.twinkle) * 0.3 + 0.7;
    const a = p.baseAlpha * tw;
    const attractBright = inRange ? (1 - dist / ATTRACT_R) : 0;

    // Particle color: lerp from white-ish to mainColor
    const white = { r: 220, g: 220, b: 230 };
    const pc = lerpColor(white, mainColor, p.colorT);

    ctx.save();
    if (attractBright > 0.05 || p.colorT > 0.3) {
      ctx.shadowBlur = 5 + attractBright * 12 + p.colorT * 8;
      ctx.shadowColor = cssRgb(mainColor, 0.7);
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = cssRgb(pc, a + attractBright * 0.4);
    ctx.fill();
    ctx.restore();
  }

  // ── Persistent heart (dim) ─────────────────────────────────────────────────
  if (drawnSegs.length > 1) {
    const endPersist = Math.max(0, drawnSegs.length - TRAIL);
    if (endPersist > 1) {
      ctx.save();
      ctx.shadowBlur = 10;
      ctx.shadowColor = cssRgb(mainColor, 0.6);
      ctx.lineWidth = 2;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      // Draw with per-segment color (segments store their color)
      for (let i = 1; i < endPersist; i++) {
        const seg = drawnSegs[i];
        ctx.strokeStyle = cssRgb(seg.color, 0.55);
        ctx.beginPath();
        ctx.moveTo(drawnSegs[i-1].x, drawnSegs[i-1].y);
        ctx.lineTo(seg.x, seg.y);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // ── Bright trail ───────────────────────────────────────────────────────────
  const trailStart = Math.max(0, drawnSegs.length - TRAIL);
  for (let i = trailStart; i < drawnSegs.length - 1; i++) {
    const age = (i - trailStart) / TRAIL;
    const s = drawnSegs[i], e = drawnSegs[i+1];
    const sc = lerpColor(s.color, e.color, 0.5);
    ctx.save();
    ctx.shadowBlur = 8 + age * 24;
    ctx.shadowColor = cssRgb(sc, 0.6 + age * 0.4);
    ctx.strokeStyle = cssRgb(sc, 0.35 + age * 0.65);
    ctx.lineWidth = 1 + age * 3.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(e.x, e.y);
    ctx.stroke();
    ctx.restore();
  }

  // ── After done: redraw full heart with cycling color ───────────────────────
  if (done) {
    const pulse = Math.sin(frame * 0.04) * 0.5 + 0.5;
    ctx.save();
    ctx.shadowBlur = 14 + pulse * 16;
    ctx.shadowColor = cssRgb(mainColor, 0.7);
    ctx.strokeStyle = cssRgb(mainColor, 0.5 + pulse * 0.3);
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(heartPath[0].x, heartPath[0].y);
    for (let i = 1; i <= TOTAL; i++) ctx.lineTo(heartPath[i].x, heartPath[i].y);
    ctx.stroke();
    ctx.restore();

    // Inner bright outline
    ctx.save();
    ctx.shadowBlur = 6;
    ctx.shadowColor = cssRgb(mainColor, 1);
    ctx.strokeStyle = cssRgb(mainColor, 0.9);
    ctx.lineWidth = 1;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(heartPath[0].x, heartPath[0].y);
    for (let i = 1; i <= TOTAL; i++) ctx.lineTo(heartPath[i].x, heartPath[i].y);
    ctx.stroke();
    ctx.restore();
  }

  // ── Tip orb ────────────────────────────────────────────────────────────────
  if (!done) {
    const pulse = Math.sin(frame * 0.18) * 0.1 + 0.9;
    const g = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, 9 * pulse);
    g.addColorStop(0,   cssRgb({r:255,g:255,b:255}, 0.9));
    g.addColorStop(0.4, cssRgb(mainColor, 0.6));
    g.addColorStop(1,   cssRgb(mainColor, 0));
    ctx.save();
    ctx.shadowBlur = 10;
    ctx.shadowColor = cssRgb(mainColor, 0.7);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 9 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 6;
    ctx.shadowColor = '#fff';
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ── Advance ────────────────────────────────────────────────────────────────
  if (!done) {
    progress = Math.min(1, progress + DRAW_SPEED);
    drawnSegs.push({ ...heartPath[tipIdx], color: { ...mainColor } });
    if (progress >= 1) done = true;
  }

  requestAnimationFrame(draw);
}

draw();
window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
</script>
</body>
</html>
