<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Login</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cyan: #0ff;
    --pink: #ff2d78;
    --bg: #1a1a2e;
    --card-bg: #16213e;
    --inner-bg: #0f3460;
    --spin-speed: 3s;
    --angle: 0deg;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(0,255,255,0.05) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 50%, rgba(255,45,120,0.05) 0%, transparent 60%);
    font-family: 'Rajdhani', sans-serif;
  }

  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  @keyframes spin {
    to { --angle: 360deg; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse-heart {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.3); }
  }

  @keyframes glow-text {
    0%, 100% { text-shadow: 0 0 8px var(--cyan), 0 0 20px var(--cyan); }
    50%       { text-shadow: 0 0 20px var(--cyan), 0 0 50px var(--cyan); }
  }

  .card {
    position: relative;
    width: 340px;
    height: 120px;
    border-radius: 20px;
    cursor: pointer;
    transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    animation: spin var(--spin-speed) linear infinite;
  }

  .card:hover {
    height: 420px;
  }

  /* spinning gradient border via ::before */
  .card::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: inherit;
    background: conic-gradient(
      from var(--angle),
      var(--cyan)   0%,
      var(--cyan)   5%,
      transparent   5%,
      transparent   40%,
      var(--pink)   40%,
      var(--pink)   50%,
      transparent   50%,
      transparent   90%,
      var(--cyan)   90%
    );
    animation: spin var(--spin-speed) linear infinite;
    filter: drop-shadow(0 0 8px var(--cyan)) drop-shadow(0 0 20px var(--pink));
    z-index: 0;
  }

  /* inner fill */
  .card::after {
    content: "";
    position: absolute;
    inset: 2px;
    border-radius: 18px;
    background: #1e1e30;
    z-index: 1;
  }

  .card-content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 0 30px;
    overflow: hidden;
  }

  /* Title row */
  .title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 120px;
    flex-shrink: 0;
  }

  .title-row .icon {
    font-size: 1.4rem;
  }

  .title-row .heart {
    color: var(--pink);
    animation: pulse-heart 1.5s ease-in-out infinite;
    display: inline-block;
  }

  .title-row h1 {
    font-family: 'Orbitron', monospace;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 6px;
    color: #e8e8f0;
    animation: glow-text 3s ease-in-out infinite;
  }

  /* Form section – hidden until hover */
  .form-section {
    width: 100%;
    opacity: 0;
    transform: translateY(10px);
    transition:
      opacity 0.4s ease 0.25s,
      transform 0.4s ease 0.25s;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-bottom: 20px;
  }

  .card:hover .form-section {
    opacity: 1;
    transform: translateY(0);
  }

  /* Inputs */
  .input-group {
    position: relative;
    width: 100%;
  }

  .input-group input {
    width: 100%;
    padding: 14px 20px;
    border-radius: 50px;
    border: 1.5px solid rgba(0,255,255,0.25);
    background: rgba(0,0,0,0.35);
    color: #e0e0f0;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 1px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .input-group input::placeholder {
    color: rgba(200,200,230,0.4);
    letter-spacing: 1px;
  }

  .input-group input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(0,255,255,0.3), inset 0 0 8px rgba(0,255,255,0.05);
  }

  /* Sign In button */
  .btn-signin {
    width: 100%;
    padding: 14px;
    border-radius: 50px;
    border: none;
    background: linear-gradient(90deg, #00d4d4, #00f5f5, #00d4d4);
    background-size: 200% auto;
    color: #0a0a1a;
    font-family: 'Orbitron', monospace;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    transition: background-position 0.4s, box-shadow 0.3s, transform 0.2s;
    box-shadow: 0 0 20px rgba(0,255,255,0.35);
  }

  .btn-signin:hover {
    background-position: right center;
    box-shadow: 0 0 35px rgba(0,255,255,0.6);
    transform: translateY(-1px);
  }

  .btn-signin:active {
    transform: translateY(1px);
  }

  /* Bottom links */
  .links-row {
    display: flex;
    justify-content: space-between;
    width: 100%;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .links-row .forgot {
    color: rgba(200,200,230,0.6);
    cursor: pointer;
    transition: color 0.2s;
  }
  .links-row .forgot:hover { color: #e0e0f0; }

  .links-row .signup {
    color: var(--pink);
    cursor: pointer;
    transition: color 0.2s, text-shadow 0.2s;
  }
  .links-row .signup:hover {
    color: #ff6fa8;
    text-shadow: 0 0 10px var(--pink);
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-content">

    <!-- Title (always visible) -->
    <div class="title-row">
      <span class="icon">🔐</span>
      <h1>LOGIN</h1>
      <span class="icon heart">❤️</span>
    </div>

    <!-- Form (revealed on hover) -->
    <div class="form-section">
      <div class="input-group">
        <input type="text" placeholder="Username" autocomplete="off">
      </div>
      <div class="input-group">
        <input type="password" placeholder="Password" autocomplete="off">
      </div>
      <button class="btn-signin">SIGN IN</button>
      <div class="links-row">
        <span class="forgot">Forgot Password</span>
        <span class="signup">Sign up</span>
      </div>
    </div>

  </div>
</div>

</body>
</html>
